name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['index.html', 'js/**', 'lib/**', 'icons/**', 'manifest.webmanifest', 'sw.js', '.github/workflows/apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stage web assets
        run: |
          mkdir -p www
          cp -r index.html sw.js manifest.webmanifest lib js icons www/

      - name: Set up Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.wildmask.game",
            "appName": "Wildmask",
            "webDir": "www",
            "android": { "backgroundColor": "#9fd9f0" }
          }
          EOF
          npx cap add android
          npx cap copy android

      - name: Force landscape + fullscreen
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildmask-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
