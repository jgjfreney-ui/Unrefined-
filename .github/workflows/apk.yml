name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, claude/animal-mask-roguelike-bse3yr]
    paths: ['index.html', 'js/**', 'lib/**', 'icons/**', 'manifest.webmanifest', 'sw.js', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stage web assets
        run: |
          mkdir -p www
          cp -r index.html sw.js manifest.webmanifest lib js icons www/

      - name: Set up Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.wildmask.game",
            "appName": "Wildmask",
            "webDir": "www",
            "android": { "backgroundColor": "#9fd9f0" }
          }
          EOF
          npx cap add android
          npx cap copy android

      - name: Force landscape + fullscreen
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Use the repo's persistent signing key
        # keeps the APK signature stable across builds so updates install in place
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../wildmask.apk

      - name: Publish APK to the "play" release (direct tap-to-install download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play
          name: 'Wildmask — playable build'
          body: |
            📱 **Install on Android:** download `wildmask.apk` below on your phone, open it,
            and allow "install unknown apps" when prompted. No extraction needed.
          make_latest: true
          files: wildmask.apk

      - name: Upload APK artifact (CI backup)
        uses: actions/upload-artifact@v4
        with:
          name: wildmask-apk
          path: wildmask.apk
          retention-days: 30
